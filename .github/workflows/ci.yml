name: CI
on:
  push:
    branches: [main, "recovery/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:auth
      - run: npm run test:collections
      - run: npm run test:schematic
      - name: Production image builds
        run: docker build -t munaiplan-frontend:ci -f dockerfile .
