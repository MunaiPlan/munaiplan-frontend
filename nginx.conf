server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /api/ {
        # Re-resolve through Docker DNS so a recreated API container is picked up.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://app:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s; # matches the API write timeout for model predictions
        client_max_body_size 22m; # two 10 MB import files + form overhead
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
